    const decoder = new TextDecoder();
    const encoder = new TextEncoder();
    let attempts = 0;
    let captchaAnswer = null;
    let humanVerified = false;
    const status = document.getElementById('status');
    const captcha = document.getElementById('captcha');

    function bytes(value) { return Uint8Array.from(atob(value), char => char.charCodeAt(0)); }
    function newCaptcha() {
      const first = Math.floor(Math.random() * 8) + 2;
      const second = Math.floor(Math.random() * 8) + 2;
      captchaAnswer = first + second;
      document.getElementById('captcha-label').textContent = 'Verificação humana: quanto é ' + first + ' + ' + second + '?';
      document.getElementById('captcha-answer').value = '';
    }
    async function decrypt(password) {
      const material = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);

      const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:bytes(payload.iv) }, key, bytes(payload.data));
      return decoder.decode(plain);
    }
    document.getElementById('unlock').addEventListener('submit', async (event) => {
      event.preventDefault();
      status.textContent = '';
      if (attempts >= 3 && !humanVerified) {
        if (Number(document.getElementById('captcha-answer').value) !== captchaAnswer) {
